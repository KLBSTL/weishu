<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色面板</title><link rel="stylesheet" href="library-style.css"><link rel="stylesheet" href="library-shell.css"><script src="library-client.js" defer></script><script src="library-pagination.js" defer></script><script src="library-panel.js" defer></script><script src="library-shell.js" defer></script></head>
<body>
<header id="panelHeader"><nav id="mainNav" aria-label="主导航"></nav><div class="window-tools"><button id="reload" title="刷新" aria-label="刷新">↻</button><button id="toggleRole" title="角色扮演" aria-label="角色扮演">◇</button><button id="collapsePanel" title="收起" aria-label="收起">⌃</button><button id="closePanel" title="关闭" aria-label="关闭">×</button></div></header>
<div id="notice" role="status" aria-live="polite"></div>
<nav id="subNav" aria-label="二级导航"></nav>
<main>
<section id="actors" hidden>
 <div class="card-library"><div class="library-list"><div class="toolbar"><label class="button">导入<input id="cardFile" type="file" accept=".json,.png" hidden></label><button id="newActor">新建</button></div><div id="cardShelf" class="item-list"></div></div>
 <div class="card-preview"><article id="cardPreview" class="character-frame"></article><div class="actions"><button id="applyCard" class="primary">使用这张卡</button><button id="exportCard">导出</button><button id="originalCard">原件</button><button id="resetPersona">恢复默认</button></div><label class="check"><input id="updateExistingCard" type="checkbox">更新当前人物，保留记忆</label></div></div>
</section>
<section id="actorEditor" hidden><div class="context-name" data-person-name></div><div class="text-editor"><nav class="field-tabs"><button data-field="description">身份与背景</button><button data-field="personality">性格与语气</button><button data-field="background">补充经历</button><button data-field="examples">说话示例</button></nav><div class="field-content">
 <label data-field-box="description">身份与背景<textarea id="description"></textarea></label>
 <label data-field-box="personality" hidden>性格与语气<textarea id="personality"></textarea></label>
 <label data-field-box="background" hidden>补充经历<textarea id="background"></textarea></label>
 <label data-field-box="examples" hidden>说话示例<textarea id="examples"></textarea></label>
 </div></div><div class="actions"><button id="saveActor" class="primary">保存</button></div></section>
<section id="persona" hidden><div class="equal-editors"><label>我的名字<input id="userName" maxlength="80"></label><label>我的身份<textarea id="userDescription"></textarea></label><label>回复风格<textarea id="style"></textarea></label></div><div class="actions"><button id="savePersona" class="primary">保存</button></div></section>
<section id="worldBindings" hidden><form id="bookBindings"><div id="enabledBookList" class="choice-grid"></div><div class="actions"><button class="primary">应用选择</button></div></form></section>
<section id="worldLibrary" hidden><div class="toolbar"><button id="newBook">新建</button><label class="button">导入<input id="bookFile" type="file" accept=".json" hidden></label><button id="exportBook">导出</button></div><div class="library-layout"><div id="bookShelf" class="item-list"></div><div class="book-summary"><label>世界书名称<input id="bookName"></label><div id="bookSummary"></div><button id="editBook">编辑条目</button></div></div></section>
<section id="books" hidden><div class="context-name" id="bookContext"></div><div class="book-editor"><div class="entry-browser"><div id="entryList" class="item-list"></div><button id="newEntry">新条目</button></div><div class="entry-meta">
 <label>标题<input id="entryName"></label><label>关键词<input id="entryKeys"></label><div class="checks"><label class="check"><input id="entryConstant" type="checkbox">常驻</label><label class="check"><input id="entryEnabled" type="checkbox" checked>启用</label></div>
 <label>归属<select id="entryKnowledge"><option value="auto">按原文识别</option><option value="self">人物经历</option><option value="world">公共资料</option><option value="author_only">不向人物公开</option></select></label><label id="entrySubjectLabel">所属人物<input id="entrySubject" maxlength="80"></label>
 </div><label class="entry-body">正文<textarea id="entryContent"></textarea></label></div><div class="actions"><button id="saveBook" class="primary">保存</button></div></section>
<section id="worldInspect" hidden><div class="toolbar"><input id="probe" placeholder="输入要测试的问题"><button id="inspect">检查</button></div><pre id="inspection"></pre></section>
<section id="memories" hidden><div class="toolbar"><input id="memoryQuery" maxlength="2000" placeholder="搜索记忆"><button id="searchMemory">查找</button></div><div id="memoryRows" class="memory-layout"></div><label class="check"><input id="deleteMemorySource" type="checkbox">同时删除原对话</label></section>
<section id="rooms" hidden><div class="toolbar"><select id="room" aria-label="选择房间"></select><button id="newRoom">新建</button></div><label>名称<input id="roomName"></label><fieldset><legend>参与人物</legend><div id="members"></div></fieldset><button id="saveRoom">保存</button><input id="topic" placeholder="聊什么"><div class="actions"><button id="startGroup">开始</button><button id="stopGroup">停止</button></div><pre id="groupStatus"></pre><div id="transcript" class="transcript"></div></section>
<section id="state" hidden><div class="equal-editors"><label>状态结构<textarea id="schema" spellcheck="false">{"actor":{}}</textarea></label><label>状态修改<textarea id="patch" spellcheck="false">[]</textarea></label></div><div class="actions"><button id="saveSchema">保存结构</button><button id="applyPatch">应用</button></div><pre id="stateView"></pre></section>
<section id="preview" hidden><label class="fill-editor">卡面<textarea id="html" spellcheck="false"></textarea></label><button id="previewHtml">预览</button><iframe id="frame" sandbox title="卡面"></iframe></section>
<div hidden id="legacyFields"><select id="actor" aria-label="人物档案"></select><select id="actorAsset"></select><select id="speakerCandidate"></select><input id="speakerName"><select id="actorBooks" multiple></select><select id="pet"></select><button id="bindActor">绑定桌宠</button><button id="researchCard">整理背景</button><select id="book"></select><select id="entry"></select><p id="bookOrigin"></p><p id="speakerHint"></p></div>
</main>
<dialog id="createActorDialog"><label>人物名称<input id="actorName" maxlength="80"></label><div class="actions"><button id="createActorConfirm" class="primary">创建</button><button id="createActorCancel">取消</button></div></dialog>
<div id="resizeEdges" aria-hidden="true"></div>
</body></html>
